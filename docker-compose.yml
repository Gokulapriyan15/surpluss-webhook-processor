
services:
  postgres:
    image: postgres:16
    container_name: surpluss-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhook_processor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_processor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
